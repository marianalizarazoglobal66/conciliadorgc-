function normRut(r){return String(r||"").toLowerCase().replace(/[\s.]/g,"");}
const fmtCLP=v=>v?Number(v).toLocaleString("es-CL"):"";
const numCLP=v=>{const s=String(v==null?"":v).replace(/[^\d-]/g,"");const f=parseInt(s,10);return isFinite(f)?f:0;};
function parseDate(s){
  if(s instanceof Date)return s;
  s=String(s||"").trim(); if(!s)return new Date(NaN);
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  return new Date(s);
}
function fmtDate(s){const d=parseDate(s);if(isNaN(d))return String(s||"");
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const LEGAL_SUF=['s.a.','s.p.a.','spa','s.a.s','sas','ltda','limitada','s.l.','s.r.l.',
  'inc.','inc','corp','corporation','llc','limited','gmbh','e.i.r.l.','eirl','cia','ag','bv','nv','oy','pty ltd','pbc'];
const GENERIC_WORDS=['admin','administracion','administradora','agencia','servicios','servicio',
  'comercial','inversiones','importadora','exportadora','consultoria','distribuidora','sistemas',
  'soluciones','empresa','grupo','holding','tecnologia','marketing','internacional','chile',
  'global','general','construccion','desarrollo','group','company','del','las','los','para'];
const stripLegal=s=>{
  let n=String(s||"").toLowerCase().trim();
  for(const sf of LEGAL_SUF)n=n.replace(new RegExp('\\b'+sf.replace(/\./g,'\\.')+'\\b','g'),' ');
  return n.replace(/[.,*()/'"%#]/g," ").replace(/\s+/g," ").trim();
};
function autoKw(nombre){
  const core=stripLegal(nombre);
  const words=core.split(/\s+/).filter(Boolean);
  if(!words.length)return String(nombre||"").toLowerCase().split(" ")[0]||"";
  const sig=words.find(w=>w.length>=4&&!GENERIC_WORDS.includes(w));
  if(sig)return sig;
  return words.slice(0,2).join(" ");
}

// ══ EXCLUSIÓN OBLIGATORIA ═════════════════════════════════════════════════════
const EXCLUSION_TERMS=["recibido","reversa","devolución","devolucion","reembolso"];
const isExcluded=tx=>{
  const t=[tx.tipo||"",tx.tercero||"",tx.comentario||""].join(" ").toLowerCase();
  if(EXCLUSION_TERMS.some(x=>t.includes(x)))return true;
  if(t.includes("comisi")&&t.includes("cardda"))return true;   // comisión Cardda → excluida del resumen
  return false;
};
// Línea de "costo tipo de cambio": sin proveedor, pero su monto va a la columna Diferencia.
const isCostoTC=tx=>{
  const t=[tx.tipo||"",tx.tercero||"",tx.comentario||""].join(" ").toLowerCase();
  return t.includes("costo")&&t.includes("tipo")&&t.includes("cambio");
};
// "Sin match" forzado: envío/transferencia a Cardda (recarga de la tarjeta) → no busca proveedor ni documento.
const isNoMatch=tx=>{
  const t=[tx.tipo||"",tx.tercero||""].join(" ").toLowerCase();
  const ter=(tx.tercero||"").toLowerCase().replace(/[^a-zñ ]/g,"").trim();
  return (t.includes("cardda")&&(t.includes("envio")||t.includes("envío")))||ter==="cardda spa";
};

// ══ MATCH PROVEEDOR (RUT exacto > Fuzzy nombre > Keywords) ════════════════════
// Normaliza a palabras: minúsculas, cualquier símbolo/espacio (*, /, -, etc.) → separador.
// Así "Google*whatsapp busin" (keyword) calza con "Google *whatsapp busin" (movimiento).
const kwNorm=s=>String(s||"").toLowerCase().replace(/[^0-9a-záéíóúñü]+/g," ").replace(/\s+/g," ").trim();
const kwMatches=(field,kw)=>{
  const fw=new Set(kwNorm(field).split(" ").filter(Boolean));
  const parts=kwNorm(kw).split(" ").filter(Boolean);
  if(!parts.length||!fw.size)return false;
  return parts.every(p=>fw.has(p));   // cada palabra del keyword debe ser una palabra del movimiento
};
const matchProv=(desc,tercero,provs)=>{
  if(!desc&&!tercero)return null;
  const terceroN=tercero||"",descN=desc||"";
  // PASO 1 — RUT exacto (prioridad máxima)
  const normT=normRut(terceroN);
  if(normT.length>=3){const byRut=provs.find(p=>p.rut&&normRut(p.rut)===normT);if(byRut)return byRut;}
  // PASO 2 — Fuzzy por nombre: coincidencia de PALABRAS COMPLETAS (no substring) y
  // se exige ≥2 palabras en común y ≥60%. Los nombres de una sola palabra (ej. "Justo SPA",
  // "Big Box Chile"→"chile") NO hacen fuzzy: se resuelven por keyword. Evita falsos positivos
  // como "fintechile"⊃"chile" o "Justo"→"Justo SPA".
  const tWords=new Set(stripLegal(terceroN).split(/\s+/).filter(w=>w.length>=4));
  if(tWords.size){
    let best=null,bestScore=0;
    for(const p of provs){
      const pWords=stripLegal(p.nombre).split(/\s+/).filter(w=>w.length>=4);
      if(pWords.length<2)continue;
      const matched=pWords.filter(w=>tWords.has(w));
      if(matched.length<2)continue;
      const ratio=matched.length/pWords.length;
      if(ratio>=0.6){const sc=ratio*100+matched.join("").length;if(sc>bestScore){bestScore=sc;best=p;}}
    }
    if(best)return best;
  }
  // PASO 3 — Keywords (tercero peso 2, tipo peso 1; gana la más larga)
  const fields=[{text:terceroN,weight:2},{text:descN,weight:1}];
  let bp=null,bs=0;
  for(const p of provs){
    for(const kw of String(p.kw||"").split(",").map(k=>k.trim()).filter(Boolean)){
      for(const {text,weight} of fields){
        if(text&&kwMatches(text,kw)){const sc=kw.length*weight;if(sc>bs){bs=sc;bp=p;}}
      }
    }
  }
  return bp;
};

// ══ CANDIDATOS DE DOCUMENTO (RUT exacto + ventana ±10 días) ═══════════════════
function getDocCandidates(tx,provMatch,docsDB){
  if(!provMatch)return[];
  const txDate=parseDate(tx.fecha);
  const txAmt=tx.debito||0;
  const provRut=normRut(provMatch.rut);
  return docsDB.filter(doc=>{
    if(provRut){ if(normRut(doc.rut)!==provRut)return false; }
    else return false; // sin RUT del proveedor no se asignan documentos (RUT es obligatorio)
    const dd=parseDate(doc.fecha);
    if(isNaN(dd)||isNaN(txDate))return false;
    return Math.abs((txDate-dd)/864e5)<=10;
  }).map(doc=>{
    const dd=parseDate(doc.fecha);
    const daysDiff=Math.abs((txDate-dd)/864e5);
    const pct=doc.total>0?Math.abs(txAmt-doc.total)/Math.max(txAmt,doc.total):1;
    const score=pct*0.7+(daysDiff/10)*0.3;
    return {...doc,_score:score,_pct:pct,_days:daysDiff};
  }).sort((a,b)=>a._score-b._score);
}

// ══ SUBSET-SUM combinatorio (DFS con poda) ════════════════════════════════════
function subsetSum(items,target,minK,maxK,tolPct){
  if(!(target>0))return null;
  let pool=items.filter(o=>o.amt>0);
  if(pool.length<minK)return null;
  const tol=target*tolPct;
  if(pool.length>18)pool=pool.slice().sort((a,b)=>Math.abs(a.amt-target)-Math.abs(b.amt-target)).slice(0,18);
  const arr=pool.slice().sort((a,b)=>b.amt-a.amt);
  let found=null;
  (function dfs(start,combo,sum){
    if(found)return;
    if(sum-target>tol)return;                       // ya sobrepasó (todos positivos)
    if(combo.length>=minK&&Math.abs(sum-target)<=tol){found=combo.slice();return;}
    if(combo.length>=maxK)return;
    for(let i=start;i<arr.length;i++){combo.push(arr[i]);dfs(i+1,combo,sum+arr[i].amt);combo.pop();if(found)return;}
  })(0,[],0);
  return found;
}

// Busca el subconjunto (minK..maxK elementos) cuya suma queda MÁS CERCA del target,
// dentro de una banda amplia (band). Ideal para fraccionados con diferencia de cambio.
function bestSubset(items,target,minK,maxK,band){
  if(!(target>0))return null;
  let pool=items.filter(o=>o.amt>0);
  if(pool.length<minK)return null;
  const tol=target*band;
  if(pool.length>16)pool=pool.slice().sort((a,b)=>Math.abs(a.amt-target)-Math.abs(b.amt-target)).slice(0,16);
  const arr=pool.slice().sort((a,b)=>b.amt-a.amt);
  let best=null,bestDiff=Infinity;
  (function dfs(start,combo,sum){
    if(sum-target>tol)return;                          // sobrepasó la banda (todos positivos)
    if(combo.length>=minK){const d=Math.abs(sum-target);if(d<=tol&&d<bestDiff){bestDiff=d;best=combo.slice();}}
    if(combo.length>=maxK)return;
    for(let i=start;i<arr.length;i++){combo.push(arr[i]);dfs(i+1,combo,sum+arr[i].amt);combo.pop();}
  })(0,[],0);
  return best;
}

// ══ ASIGNACIÓN DE DOCUMENTOS — 4 casos en orden de prioridad ══════════════════
// Caso 4 (N TX→1 doc, fraccionado) → Caso 3 (1 TX→N docs, consolidado) → Casos 1&2 (1→1)
function assignDocs(txs,provs,docsDB){
  const n=txs.length;
  const result=new Array(n).fill(null);
  if(!n)return result;
  const excluded=txs.map(isExcluded);
  const provOf=txs.map((tx,i)=>(excluded[i]||isNoMatch(tx))?null:matchProv(tx.tipo,tx.tercero,provs));
  const usedDoc=new Set();
  const dk=d=>d.tipo+"|"+d.ndoc+"|"+d.rut;
  // documentos ya marcados como conciliados (en otra tarjeta) → no se reutilizan
  docsDB.forEach(d=>{if(d.conciliado)usedDoc.add(dk(d));});
  const sameMonth=(a,b)=>!isNaN(a)&&!isNaN(b)&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
  const sameDay=(a,b)=>sameMonth(a,b)&&a.getDate()===b.getDate();
  const NEAR=20;                                  // ventana de fecha doc↔movimiento (días)
  const within=(a,b,days)=>isNaN(a)||isNaN(b)||Math.abs((a-b)/864e5)<=days;  // tolera fechas inválidas

  // ── COSTO TIPO DE CAMBIO — sin proveedor; su monto va a la columna Diferencia ──
  txs.forEach((tx,i)=>{
    if(excluded[i]||result[i]||!(tx.debito>0))return;
    if(isCostoTC(tx))result[i]={_costoTC:true,_diffAmt:tx.debito||0,_obs:"Costo tipo de cambio"};
  });

  // ── REVERSADOS — compra que coincide EXACTO con el valor de una reversa del mismo mes ──
  // Ambas líneas se marcan "Reversado", quedan en rojo y la compra no se cruza con documento.
  const revIdx=txs.map((tx,i)=>excluded[i]?i:-1).filter(i=>i>=0);  // líneas de reversa/devolución
  const usedRev=new Set();
  txs.forEach((tx,i)=>{
    if(excluded[i]||result[i]||!(tx.debito>0))return;              // solo compras (débito) no excluidas
    const td=parseDate(tx.fecha);
    for(const ri of revIdx){
      if(usedRev.has(ri))continue;
      const rv=txs[ri];
      const rval=(rv.abono>0?rv.abono:rv.debito)||0;               // valor de la reversa (abono o débito)
      if(rval>0&&Math.abs(rval-tx.debito)<1&&(sameMonth(parseDate(rv.fecha),td)||isNaN(td))){
        result[i]={_reversado:true,_obs:"Reversado"};
        result[ri]={_reversado:true,_obs:"Reversado"};
        usedRev.add(ri);break;
      }
    }
  });

  // índices activos agrupados por proveedor (excluye reversados ya marcados)
  const byProv=new Map();
  txs.forEach((tx,i)=>{
    if(excluded[i]||result[i]||!provOf[i]||!(tx.debito>0))return;
    const id=provOf[i].id;
    if(!byProv.has(id))byProv.set(id,[]);
    byProv.get(id).push(i);
  });

  // ── MOTOR DE ASIGNACIÓN (por proveedor · alcance: mismo mes) ──────────────
  const FRAC_BAND=0.30;   // fraccionado N→1 (incluye diferencia de cambio)
  const SUM_BAND=0.05;    // consolidado 1→N (suma de docs ≈ egreso)
  const EXACT_BAND=0.02;  // 1→1 casi exacto
  const ONE_BAND=0.15;    // 1→1 aproximado (resto)

  // 1 doc → varias TX (fraccionado): doc en cada línea; diferencia solo en la 1ª
  const assignFrac=(ids,doc)=>{
    const sum=ids.reduce((s,i)=>s+(txs[i].debito||0),0);
    const diffAmt=sum-doc.total;
    const obs=doc.total>0&&Math.abs(diffAmt)/doc.total>0.001?`Diferencia cambio ${(Math.abs(diffAmt)/doc.total*100).toFixed(2)}%`:"";
    ids.forEach((i,k)=>{result[i]={...doc,_frac:ids.length>1,_fracMain:k===0,_diffAmt:k===0?diffAmt:null,_obs:k===0?obs:""};});
    usedDoc.add(dk(doc));
  };
  // 1 TX → varios docs (consolidado): concatena N° y códigos; diferencia = egreso − suma docs
  const assignMulti=(i,docs)=>{
    const totalSum=docs.reduce((s,d)=>s+d.total,0);
    docs.forEach(d=>usedDoc.add(dk(d)));
    result[i]={...docs[0],
      ndoc:docs.map(d=>d.ndoc).join(" / "),
      codigo:[...new Set(docs.map(d=>d.codigo).filter(Boolean))].join(", "),
      centroCosto:[...new Set(docs.flatMap(d=>String(d.centroCosto||"").split(",").map(s=>s.trim()).filter(Boolean)))].join(", "),
      total:totalSum,_multi:docs.length>1,_docs:docs.slice(),  // documentos individuales (para mostrar en líneas separadas)
      _diffAmt:(txs[i].debito||0)-totalSum,_obs:""};
  };

  for(const [,idxs] of byProv){
    const prov=provOf[idxs[0]];
    const pRut=normRut(prov.rut);
    if(!pRut)continue;
    const allDocs=docsDB.filter(d=>normRut(d.rut)===pRut&&d.total>0);
    if(!allDocs.length)continue;
    const dUnused=d=>!usedDoc.has(dk(d));
    const tUnused=i=>!result[i];

    // PROVEEDORES POR FECHA (Replit, Anthropic): cada cargo cruza con el documento del MISMO RUT
    // y fecha dentro de ±1 día (tolerancia de sensibilidad). Prioriza misma fecha exacta y, dentro
    // de la ventana, el de monto más cercano.
    if(/replit|anthropic/i.test(prov.nombre||"")){
      const DIA=1;
      const cerca=(dd,td)=>!isNaN(dd)&&!isNaN(td)&&Math.abs((dd-td)/864e5)<=DIA;
      for(const i of idxs){
        if(!tUnused(i))continue; const amt=txs[i].debito||0; const td=parseDate(txs[i].fecha);
        const cand=allDocs.filter(dUnused).filter(d=>cerca(parseDate(d.fecha),td));
        if(!cand.length)continue;
        // ordena por proximidad de fecha y luego de monto
        cand.sort((a,b)=>{const da=Math.abs((parseDate(a.fecha)-td)/864e5),db=Math.abs((parseDate(b.fecha)-td)/864e5);return da!==db?da-db:Math.abs(a.total-amt)-Math.abs(b.total-amt);});
        const doc=cand[0];
        result[i]={...doc,_diffAmt:amt-doc.total,_obs:""};usedDoc.add(dk(doc));
      }
      continue;   // no aplicar la lógica general a estos proveedores
    }

    // 1) 1→1 casi exacto (dentro de ±NEAR días)
    for(const i of idxs){
      if(!tUnused(i))continue; const amt=txs[i].debito||0; const td=parseDate(txs[i].fecha);
      const m=allDocs.filter(dUnused).filter(d=>within(parseDate(d.fecha),td,NEAR)).find(d=>Math.abs(d.total-amt)<Math.max(100,amt*EXACT_BAND));
      if(m){result[i]={...m,_diffAmt:amt-m.total,_obs:""};usedDoc.add(dk(m));}
    }

    // 2) CONSOLIDADO — 1 TX → varios docs (prioriza documentos de la MISMA FECHA del movimiento)
    for(const i of idxs){
      if(!tUnused(i))continue; const amt=txs[i].debito||0; const td=parseDate(txs[i].fecha);
      const sameDate=allDocs.filter(dUnused).filter(d=>sameDay(parseDate(d.fecha),td));
      if(sameDate.length>=2){
        const sum=sameDate.reduce((s,d)=>s+d.total,0);
        if(amt>0&&Math.abs(sum-amt)/amt<=SUM_BAND){assignMulti(i,sameDate);continue;} // todas las de esa fecha
        const sub=subsetSum(sameDate.map(d=>({amt:d.total,ref:d})),amt,2,8,SUM_BAND);
        if(sub){assignMulti(i,sub.map(o=>o.ref));continue;}                            // subconjunto de esa fecha
      }
      const near=getDocCandidates(txs[i],prov,docsDB).filter(dUnused);                  // si no, docs del mes (±10 días)
      if(near.length>=2){
        const sub=subsetSum(near.map(d=>({amt:d.total,ref:d})),amt,2,8,SUM_BAND);
        if(sub&&sub.length>=2){assignMulti(i,sub.map(o=>o.ref));continue;}
      }
    }

    // 3) ASIGNACIÓN POR DOCUMENTO (mismo mes). Maneja a la vez:
    //   • 1→1 múltiple (Atlassian): cada línea con SU documento
    //   • N→1 fraccionado con documento dominante (Anthropic): el grande absorbe el resto
    //   • N→1 cuando una factura cubre 2 líneas (TikTok): la factura toma el mejor subconjunto
    // Estrategia: los documentos NO dominantes toman primero su mejor subconjunto de líneas
    // (incluido tamaño 1, eligiendo la combinación cuya suma quede MÁS cerca); luego el
    // documento dominante (≥60% del total de docs del proveedor en el mes) absorbe lo que reste.
    const monthDocs=allDocs.filter(dUnused).filter(d=>{const dd=parseDate(d.fecha);return idxs.some(i=>within(parseDate(txs[i].fecha),dd,NEAR));});
    const totDocs=monthDocs.reduce((s,d)=>s+d.total,0);
    const domDoc=monthDocs.slice().sort((a,b)=>b.total-a.total)[0];
    const isDom=domDoc&&totDocs>0&&domDoc.total>=0.6*totDocs;
    const poolLines=doc=>{const dd=parseDate(doc.fecha);return idxs.filter(tUnused).filter(i=>within(parseDate(txs[i].fecha),dd,NEAR)).map(i=>({amt:txs[i].debito||0,ref:i}));};
    // 3a) documentos no dominantes (de menor a mayor), mejor subconjunto (minK=1)
    for(const doc of monthDocs.slice().sort((a,b)=>a.total-b.total)){
      if(!dUnused(doc))continue;
      if(isDom&&doc===domDoc)continue;
      const best=bestSubset(poolLines(doc),doc.total,1,12,FRAC_BAND);
      if(best)assignFrac(best.map(o=>o.ref),doc);
    }
    // 3b) documento dominante: absorbe TODAS las líneas restantes del mes (si la suma calza),
    //     si no, su mejor subconjunto
    if(isDom&&dUnused(domDoc)){
      const pool=poolLines(domDoc);
      if(pool.length){
        const sumAll=pool.reduce((s,o)=>s+o.amt,0);
        if(domDoc.total>0&&Math.abs(sumAll-domDoc.total)/domDoc.total<=FRAC_BAND)assignFrac(pool.map(o=>o.ref),domDoc);
        else{const best=bestSubset(pool,domDoc.total,1,12,FRAC_BAND);if(best)assignFrac(best.map(o=>o.ref),domDoc);}
      }
    }

    // 4.0) DESFASE DE PAGO (~30 días, ej. Entel): si quedó sin documento, intenta con la SUMA de
    // ≥2 facturas del MES ANTERIOR (21–50 días antes) que coincida con el pago (±5%). Exige ≥2
    // documentos para no reintroducir el caso de un único documento lejano (ej. HSP 26 días).
    for(const i of idxs){
      if(!tUnused(i))continue; const amt=txs[i].debito||0; if(!(amt>0))continue; const td=parseDate(txs[i].fecha);
      const prev=allDocs.filter(dUnused).filter(d=>{const dd=parseDate(d.fecha);if(isNaN(dd)||isNaN(td))return false;const dias=(td-dd)/864e5;return dias>NEAR&&dias<=50;});
      if(prev.length<2)continue;
      const sub=subsetSum(prev.map(d=>({amt:d.total,ref:d})),amt,2,8,SUM_BAND);
      if(sub)assignMulti(i,sub.map(o=>o.ref));
    }

    // 4) 1→1 — el resto de líneas se asocian al documento del proveedor dentro de ±NEAR días,
    // SIN límite de diferencia (se muestra la diferencia, aunque sea grande). Trae documentos
    // con gran diferencia de pago (ej. Marbella) pero NO documentos lejanos en fecha (ej. HSP 26 días).
    for(const i of idxs){
      if(!tUnused(i))continue; const amt=txs[i].debito||0; const td=parseDate(txs[i].fecha);
      const cands=allDocs.filter(dUnused).filter(d=>within(parseDate(d.fecha),td,NEAR));
      if(!cands.length)continue;
      cands.sort((a,b)=>Math.abs(a.total-amt)-Math.abs(b.total-amt));
      const doc=cands[0];
      const obs=doc.total>0&&Math.abs(amt-doc.total)/doc.total>0.03?"Diferencia con documento":"";
      result[i]={...doc,_diffAmt:amt-doc.total,_obs:obs};usedDoc.add(dk(doc));
    }
  }

  // ── 5) MATCH INVERSO POR MONTO — cualquier egreso que quedó SIN documento ──
  // Cubre nombres genéricos/pasarelas que no identifican proveedor, y también cuando el
  // proveedor identificado fue erróneo (ej. "E-commerce..." → keyword "merce") y no trajo doc.
  // Busca un documento NO usado cuyo VALOR coincida (mismo mes / ±10 días) y toma el proveedor
  // desde ese documento (reemplaza el nombre mostrado).
  const AMT_BAND=0.01; // coincidencia de valor: exacto (±1% o $100)
  // un proveedor "tiene documentos" si existe algún doc con su RUT (cualquier mes)
  const provTieneDoc=p=>p&&p.rut&&docsDB.some(d=>normRut(d.rut)===normRut(p.rut));
  txs.forEach((tx,i)=>{
    if(result[i]||excluded[i]||isNoMatch(tx)||!(tx.debito>0))return;   // solo egresos SIN documento
    // Respetar el proveedor por nombre/keyword: si identificó un proveedor que SÍ tiene
    // documentos, NO se reasigna por monto (ej. Amazon). El match por monto solo actúa si no
    // hay proveedor, o si el proveedor identificado no tiene ningún documento (keyword erróneo).
    if(provOf[i]&&provTieneDoc(provOf[i]))return;
    const amt=tx.debito; const td=parseDate(tx.fecha);
    let best=null,bestDiff=Infinity;
    for(const doc of docsDB){
      if(!(doc.total>0)||usedDoc.has(dk(doc)))continue;
      const dd=parseDate(doc.fecha);
      if(!within(dd,td,NEAR))continue;
      const diff=Math.abs(doc.total-amt);
      if(diff<=Math.max(100,amt*AMT_BAND)&&diff<bestDiff){bestDiff=diff;best=doc;}
    }
    if(best){
      usedDoc.add(dk(best));
      result[i]={...best,_diffAmt:amt-best.total,_byAmount:true,_obs:"Proveedor asignado por monto"};
    }
  });
  return result;
}

// ══ PARSER ESTADO DE CUENTA ═══════════════════════════════════════════════════
function detectHeader(data){
  for(let i=0;i<Math.min(10,data.length);i++){
    if((data[i]||[]).filter(c=>String(c||"").trim()).length>=4)return i;
  }
  return -1;
}
function colFinder(headers){return(...keys)=>{for(const k of keys){const idx=headers.findIndex(h=>h.includes(k));if(idx>=0)return idx;}return-1;};}
function parseEC(data){
  const hi=detectHeader(data);if(hi<0)return[];
  const headers=(data[hi]||[]).map(c=>String(c||"").trim().toLowerCase());
  const col=colFinder(headers);
  // Detecta el formato CARDDA por sus columnas "Egresos"/"Ingresos" (CLP) + "Proveedor".
  const esCardda=headers.some(h=>h.includes("egresos"))&&headers.some(h=>h.includes("ingresos"));
  const ci=esCardda?{
    fecha:col("fecha"),
    tipo:col("descripción","descripcion"),                 // descripción completa (para keywords)
    tercero:col("proveedor"),                              // nombre limpio del comercio
    tarjeta:headers.indexOf("tarjeta")>=0?headers.indexOf("tarjeta"):col("tarjeta"),
    debito:col("egresos"),                                 // cargo en CLP (negativo)
    abono:col("ingresos"),                                 // abonos en CLP
    id:col("id"),
    comentario:col("comentario"),
  }:{
    fecha:col("fecha de la transac","fecha"),
    tipo:col("tipo de transac","tipo","descripcion","glosa","detalle","concepto"),
    tercero:col("nombre tercero","tercero","comercio","beneficiario","nombre"),
    tarjeta:col("ltimos 4","tarjeta","cuenta","card"),
    debito:col("monto debitado","debito","débito","cargo","monto","importe"),
    abono:col("monto acreditado","abono","crédito","credito"),
    id:col("id de la transac","referencia","folio","ref","id"),
    comentario:col("comentario"),
  };
  const estadoCol=esCardda?col("estado"):-1;              // Cardda: columna Estado
  const rows=[];
  for(let i=hi+1;i<data.length;i++){
    const row=data[i]||[];
    const g=idx=>idx>=0?String(row[idx]==null?"":row[idx]).trim():"";
    // Cardda: dejar fuera de la conciliación las líneas Pendiente / Rechazada
    if(estadoCol>=0){const est=g(estadoCol).toLowerCase();if(est.includes("pendiente")||est.includes("rechaz"))continue;}
    let tipo=g(ci.tipo),fecha=g(ci.fecha),tercero=g(ci.tercero);
    if(esCardda&&!tercero)tercero=tipo;                    // si no hay Proveedor, usar la descripción
    if(!tipo&&!fecha&&!tercero)continue;
    rows.push({fecha,tipo,tercero,tarjeta:g(ci.tarjeta),
      debito:Math.abs(numCLP(g(ci.debito))),abono:Math.abs(numCLP(g(ci.abono))),idTx:g(ci.id),comentario:g(ci.comentario)});
  }
  return rows;
}

// ══ PARSER DOCS MANAGER ═══════════════════════════════════════════════════════
function parseDocs(data){
  const hi=detectHeader(data);if(hi<0)return[];
  const headers=(data[hi]||[]).map(c=>String(c||"").trim().toLowerCase());
  const col=colFinder(headers);
  const ci={
    ndoc:col("nº doc","n° doc","nro doc","núm doc","ndoc","folio","nº","n°","número","numero"),
    tipo:col("tipo"),
    rut:col("rut"),
    razon:col("razón","razon","social","proveedor","nombre"),
    fecha:col("fecha"),
    total:col("total facturado","total","monto","importe","valor"),
    codigo:col("código","codigo","cuenta","cod"),
    descripcion:col("descripción","descripcion","glosa","detalle"),
    centro:col("código centro costo","centro de costo","centro costo","cod centro","ccosto"),
  };
  // El reporte trae una fila por línea/centro de costo: se AGRUPA por documento
  // (Tipo|Nº|RUT) para no duplicar totales y para consolidar los centros de costo.
  const map=new Map();
  for(let i=hi+1;i<data.length;i++){
    const row=data[i]||[];
    const g=idx=>idx>=0?String(row[idx]==null?"":row[idx]).trim():"";
    const ndoc=g(ci.ndoc),rut=g(ci.rut),razon=g(ci.razon);
    if(!ndoc&&!rut&&!razon)continue;
    const key=g(ci.tipo)+"|"+ndoc+"|"+rut;
    const cc=g(ci.centro);
    if(map.has(key)){
      if(cc){const d=map.get(key);if(!d._cc.has(cc)){d._cc.add(cc);d.centroCosto=d.centroCosto?d.centroCosto+", "+cc:cc;}}
    }else{
      map.set(key,{tipo:g(ci.tipo),ndoc,rut,razon,fecha:g(ci.fecha),
        total:numCLP(g(ci.total)),codigo:g(ci.codigo),descripcion:g(ci.descripcion),
        centroCosto:cc,_cc:new Set(cc?[cc]:[])});
    }
  }
  return [...map.values()].map(d=>{delete d._cc;return d;});
}

// ══ PARSER PROVEEDORES (import Excel) ═════════════════════════════════════════
function parseProvsXlsx(data){
  const hi=detectHeader(data);if(hi<0)return[];
  const headers=(data[hi]||[]).map(c=>String(c||"").trim().toLowerCase());
  const col=colFinder(headers);
  const ci={
    nombre:col("proveedor","razón","razon","social","nombre"),
    rut:col("rut"),
    kw:col("keyword","palabra","kw"),
  };
  const rows=[];
  for(let i=hi+1;i<data.length;i++){
    const row=data[i]||[];
    const g=idx=>idx>=0?String(row[idx]==null?"":row[idx]).trim():"";
    const nombre=g(ci.nombre);if(!nombre)continue;
    rows.push({nombre,rut:g(ci.rut),kw:g(ci.kw)});
  }
  return rows;
}

// ══ EXPORT EXCEL (.xls vía HTML con namespace) ════════════════════════════════
const xlsHead='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Hoja1</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>';
function downloadXls(html,filename){
  const blob=new Blob(['﻿'+xlsHead+html+'</body></html>'],{type:"application/vnd.ms-excel"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// valor con edición manual aplicada (si existe) — key de línea + campo
const editVal=(edits,key,field,base)=>(edits&&edits[key]&&edits[key][field]!==undefined&&edits[key][field]!=="")?edits[key][field]:base;
const hasEdit=(edits,key,field)=>!!(edits&&edits[key]&&edits[key][field]!==undefined&&edits[key][field]!=="");

function exportXLSX(txs,assignments,provMatches,periodo,edits){
  const total=txs.length;
  const matchCount=provMatches.filter(Boolean).length;
  const docCount=assignments.filter(Boolean).length;
  const exclCount=txs.filter(isExcluded).length;
  let h='<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-family:Segoe UI,Arial;font-size:11px">';
  h+=`<tr><td colspan="16" style="background:#0D1117;color:#fff;font-size:16px;font-weight:bold;padding:8px">MOVIMIENTOS TARJETA — ${esc(periodo||"PERÍODO")}</td></tr>`;
  h+=`<tr><td colspan="16" style="background:#1B279E;color:#fff;padding:6px">Global66 · Cruce con Listado Manager</td></tr>`;
  h+=`<tr><td colspan="16" style="background:#1C2128;color:#E6EDF3;padding:6px">Total: ${total}  |  Con proveedor: ${matchCount}  |  Con doc: ${docCount}  |  Excluidas: ${exclCount}</td></tr>`;
  const th=(t,c)=>`<td style="background:${c};color:#fff;font-weight:bold;padding:5px">${t}</td>`;
  h+='<tr>'+th('Fecha','#1F6FEB')+th('Tipo Transacción','#1F6FEB')+th('Nombre Tercero','#1F6FEB')+th('Tar.','#1F6FEB')+th('Débito','#1F6FEB')+th('Abono','#1F6FEB')+th('Proveedor','#1F6FEB')+th('RUT','#1F6FEB')+th('Manager','#1A7F37')+th('Cod. Servicio','#1A7F37')+th('Centro Costo','#1A7F37')+th('N° Doc','#1A7F37')+th('Fecha Doc','#1A7F37')+th('Total Doc','#1A7F37')+th('Diferencia','#1A7F37')+th('Observaciones','#1A7F37')+'</tr>';
  txs.forEach((r,i)=>{
    const excl=isExcluded(r);
    const p=excl?null:provMatches[i];
    const d=assignments[i];
    const rev=d&&d._reversado;
    const dd=d&&!d._reversado?d:null;
    const ctc=dd&&dd._costoTC;
    let bg="#FFFFFF";
    if(excl||rev)bg="#FBE9E7";else if(ctc)bg="#FFFFFF";else if(dd&&dd._frac)bg="#FFF4D6";else if(dd&&dd._multi)bg="#E3F0FF";else if(dd)bg="#EAF7EC";
    const mgr=(excl||rev||ctc)?"":dd?(dd._frac?"FRACC.":dd._multi?"MULTI":"SI"):"";
    const ki=String(i);
    const td=(v,al)=>`<td style="padding:4px;text-align:${al||'left'}">${esc(v)}</td>`;
    const provTxt=rev?"REVERSADO":(excl?"EXCLUIDA":((dd&&dd._byAmount)?(dd.razon||"?")+" (por monto)":(p?p.nombre:(dd&&dd.razon?dd.razon+" (por monto)":"Sin match"))));
    const rutTxt=rev?"":((dd&&dd._byAmount)?dd.rut:(p?p.rut:(dd?dd.rut:"")));
    const docs=(dd&&dd._multi&&dd._docs&&dd._docs.length>1)?dd._docs:null;
    const d0=docs?docs[0]:dd;
    // valores con edición manual aplicada
    const eN=editVal(edits,ki,"ndoc",d0?d0.ndoc:""), eF=editVal(edits,ki,"fecha",d0?d0.fecha:""), eT=editVal(edits,ki,"total",d0&&d0.total?d0.total:"");
    const baseDiff=(dd&&!(dd._frac&&!dd._fracMain)&&dd._diffAmt!=null)?dd._diffAmt:"";
    const eDiff=editVal(edits,ki,"diff",baseDiff);
    const obs=rev?"REVERSADO":(excl?"EXCLUIDA":editVal(edits,ki,"obs",dd?dd._obs:""));
    const money=v=>(v!==""&&v!=null)?"$"+fmtCLP(v):"";
    h+=`<tr style="background:${bg}">`+
      td(fmtDate(r.fecha))+td(r.tipo)+td(r.tercero)+td(r.tarjeta,'center')+
      td(r.debito?"$"+fmtCLP(r.debito):"",'right')+td(r.abono?"$"+fmtCLP(r.abono):"",'right')+
      td(provTxt)+td(rutTxt)+

// ══ BASE CARGA MASIVA (2 hojas) ═══════════════════════════════════════════════
function exportCargaMasiva(txs,assignments,provMatches,periodo,cierre,edits){
  const dk=d=>(d.tipo||"")+"|"+(d.ndoc||"")+"|"+(d.rut||"");
  // 1) Documentos únicos asociados (cada documento una vez) — con ediciones manuales
  const seen=new Set(); const docsRows=[];
  txs.forEach((r,i)=>{
    if(isExcluded(r))return; const d=assignments[i]; if(!d||d._reversado||d._costoTC)return;
    const p=provMatches[i];
    const list=(d._multi&&d._docs&&d._docs.length)?d._docs:[d];  // multi → cada doc; resto → el doc
    list.forEach((doc,li)=>{
      const lk=li===0?String(i):i+"_"+(li-1);  // misma clave de edición que la tabla EECC
      const eN=editVal(edits,lk,"ndoc",doc.ndoc||""), eF=editVal(edits,lk,"fecha",doc.fecha||""), eT=editVal(edits,lk,"total",doc.total||0);
      const k=(doc.tipo||"")+"|"+eN+"|"+(doc.rut||""); if(seen.has(k))return; seen.add(k);
      docsRows.push({rut:doc.rut||"",prov:(p&&p.nombre)?p.nombre:(doc.razon||""),codigo:doc.codigo||"",
        centro:doc.centroCosto||"",tipo:doc.tipo||"",ndoc:eN,fecha:eF,total:eT||0});
    });
  });
  // 2) Suma de la columna Diferencia (misma que el Excel de movimientos) — con ediciones
  let totalDiff=0;
  txs.forEach((r,i)=>{const d=assignments[i];if(!d||d._reversado)return;
    const base=(!(d._frac&&!d._fracMain)&&d._diffAmt!=null)?d._diffAmt:"";
    const ev=editVal(edits,String(i),"diff",base); const n=ev===""||ev==null?0:Number(ev);
    if(!isNaN(n))totalDiff+=n;});
  // 3) Proveedores asociados por NOMBRE sin documento (solo nombre y rut, únicos)
  const docRuts=new Set(docsRows.map(x=>normRut(x.rut)));
  const sinDoc=new Map();
  txs.forEach((r,i)=>{
    if(isExcluded(r))return; const d=assignments[i]; const p=provMatches[i];
    if(p&&!d&&p.rut&&!docRuts.has(normRut(p.rut))&&!sinDoc.has(normRut(p.rut)))sinDoc.set(normRut(p.rut),{nombre:p.nombre,rut:p.rut});
  });

  // ── HOJA 1 ──
  const h1=[["RUT","Proveedor","Cod Serv","Centro Costo","Tipo Doc","N° Doc","Fecha Doc","Total Doc"]];
  docsRows.forEach(x=>h1.push([x.rut,x.prov,x.codigo,x.centro,x.tipo,x.ndoc,x.fecha,x.total]));
  h1.push(["","Diferencia Tipo de Cambio","","","","","",totalDiff]);
  [...sinDoc.values()].forEach(x=>h1.push([x.rut,x.nombre,"","","","","",""]));

  // ── HOJA 2 — CARGA MASIVA (layout exacto del formato: 22 columnas; solo se llenan las obligatorias) ──
  const glosa="MLH ESTADO DE CUENTA "+(periodo||"");
  const cuenta=t=>{const u=String(t||"").toUpperCase();return(u==="FACE"||u==="COMEX"||u==="FCEE"||u==="BOH")?"210401":(u==="INTST"?"210404":"");};
  const COLS=["Tipo de comprobante","Esquema","Glosa comprobante","Fecha contable","Total debe","Total haber","Ítem detalle comprobante","Código unidad de negocio","Glosa detalle","RUT cliente","RUT personal","Código cuenta contable","Código centro costos","Monto debe","Monto haber","Tipo de documento","Fecha de documento","Número de documento","Concepto 1","Concepto 2","Concepto 3","Concepto 4"];
  const h2=[COLS];
  docsRows.forEach((x,n)=>h2.push([
    "T",        // Tipo de comprobante
    "",         // Esquema
    glosa,      // Glosa comprobante
    cierre||"", // Fecha contable
    "",         // Total debe
    "",         // Total haber
    n+1,        // Ítem detalle comprobante
    "1",        // Código unidad de negocio
    "",         // Glosa detalle
    x.rut,      // RUT cliente
    "",         // RUT personal
    cuenta(x.tipo), // Código cuenta contable
    "",         // Código centro costos (no obligatorio)
    x.total,    // Monto debe
    "",         // Monto haber
    x.tipo,     // Tipo de documento
    x.fecha,    // Fecha de documento
    x.ndoc,     // Número de documento
    "","","",""  // Concepto 1-4
  ]));

  // Datos en MAYÚSCULAS (solo los valores; el encabezado se mantiene tal cual el formato)
  const up=v=>typeof v==="string"?v.toUpperCase():v;
  const upData=aoa=>aoa.map((row,ri)=>ri===0?row.slice():row.map(up));
  // Fuente Calibri 11 en todas las celdas; encabezado fondo azul + blanco negrita
  const FONT={name:"Calibri",sz:11};
  const HFONT={name:"Calibri",sz:11,bold:true,color:{rgb:"FFFFFF"}};
  const FILL={patternType:"solid",fgColor:{rgb:"2536E8"}};
  const styleSheet=ws=>{const ref=ws['!ref'];if(!ref)return;const rg=XLSX.utils.decode_range(ref);
    for(let r=rg.s.r;r<=rg.e.r;r++)for(let c=rg.s.c;c<=rg.e.c;c++){const ad=XLSX.utils.encode_cell({r,c});const cell=ws[ad];if(!cell)continue;
      cell.s=r===0?{fill:FILL,font:HFONT,alignment:{vertical:"center"}}:{font:FONT};}};
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(upData(h1)); ws1['!cols']=[{wch:12},{wch:42},{wch:12},{wch:22},{wch:10},{wch:14},{wch:12},{wch:14}];
  styleSheet(ws1);
  XLSX.utils.book_append_sheet(wb,ws1,"Documentos");
  const ws2=XLSX.utils.aoa_to_sheet(upData(h2));
  styleSheet(ws2);
  XLSX.utils.book_append_sheet(wb,ws2,"Carga Masiva");
  const today=fmtDate(new Date()).replace(/\//g,"-");
  XLSX.writeFile(wb,`BASE_CARGA_MASIVA_${today}.xlsx`);
}

// ══ APP ═══════════════════════════════════════════════════════════════════════
function App(){
  const [txs,setTxs]=useState([]);
  const [provs,setProvs]=useState(loadP());
  const [docsDB,setDocsDB]=useState(DOCS_DB);
  const [assignments,setAssignments]=useState([]);
  const [processed,setProcessed]=useState(false);
  const [loading,setLoading]=useState(false);
  const [cierre,setCierre]=useState("");
  const [edits,setEdits]=useState({});   // ediciones manuales por línea: {lineKey:{ndoc,fecha,total,diff,obs}}
  const setEdit=(k,f,v)=>setEdits(p=>({...p,[k]:{...(p[k]||{}),[f]:v}}));
  const [tab,setTab]=useState("cruce");
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [searchP,setSearchP]=useState("");
  const [page,setPage]=useState(1);
  const [docsName,setDocsName]=useState("");
  const [docsMsg,setDocsMsg]=useState("");
  const [ecMsg,setEcMsg]=useState("");
  const [dragDocs,setDragDocs]=useState(false);
  const [dragEC,setDragEC]=useState(false);
  const [dragProv,setDragProv]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [editP,setEditP]=useState(null);
  const [form,setForm]=useState({nombre:"",rut:"",kw:""});
  const [provMsg,setProvMsg]=useState("");
  const [session,setSession]=useState(null);
  const [dbMsg,setDbMsg]=useState("");
  const [showLogin,setShowLogin]=useState(false);
  const [authEmail,setAuthEmail]=useState("");
  const [authPass,setAuthPass]=useState("");
  const [authErr,setAuthErr]=useState("");
  const [authBusy,setAuthBusy]=useState(false);
  const ecRef=useRef();const docsRef=useRef();const provRef=useRef();
  const PAGE_SIZE=100;
  // Puede editar si NO hay nube (modo archivo local) o si hay sesión iniciada.
  const canEdit=!sb||!!session;

  // ── useMemo: mapa RUT→prov ────────────────────────────────────────────────
  const provMap=useMemo(()=>{const m=new Map();for(const p of provs)if(p.rut)m.set(normRut(p.rut),p);return m;},[provs]);
  // ── useMemo: match de proveedor por TX (una sola vez) ─────────────────────
  const txProvMatches=useMemo(()=>txs.map(r=>(isExcluded(r)||isNoMatch(r))?null:matchProv(r.tipo,r.tercero,provs)),[txs,provs]);
  // ── useMemo: estadísticas ─────────────────────────────────────────────────
  const {matchCount,docCount,exclCount}=useMemo(()=>({
    matchCount:txs.reduce((n,_,i)=>{const a=assignments[i];if(a&&a._reversado)return n;return n+((txProvMatches[i]||(a&&a._byAmount))?1:0);},0),
    docCount:assignments.filter(a=>a&&!a._reversado&&!a._costoTC).length,
    exclCount:txs.filter(isExcluded).length,
  }),[txProvMatches,assignments,txs]);
  const pctId=useMemo(()=>{const den=txs.length-exclCount;return den>0?Math.round(matchCount/den*100):0;},[matchCount,exclCount,txs]);
  // ── useMemo: filtrado + vista ─────────────────────────────────────────────
  const txView=useMemo(()=>txs.map((r,i)=>({...r,_origIdx:i,_prov:txProvMatches[i]})).filter(r=>{
    const p=r._prov,d=assignments[r._origIdx];
    const realDoc=d&&!d._reversado;
    const hasProv=(p||(d&&d._byAmount))&&!(d&&d._reversado);
    if(filter==="match"&&!hasProv)return false;
    if(filter==="nomatch"&&hasProv)return false;
    if(filter==="condoc"&&!realDoc)return false;
    if(filter==="sindoc"&&(realDoc||!hasProv))return false;
    if(search){const s=search.toLowerCase();if(!String(r.tipo||"").toLowerCase().includes(s)&&!String(r.tercero||"").toLowerCase().includes(s))return false;}
    return true;
  }),[txs,txProvMatches,assignments,filter,search]);
  const txPage=useMemo(()=>txView.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),[txView,page]);
  const totalPages=Math.max(1,Math.ceil(txView.length/PAGE_SIZE));
  // ── useMemo: filtro proveedores ───────────────────────────────────────────
  const filtProv=useMemo(()=>provs.filter(p=>{
    if(!searchP)return true;const s=searchP.toLowerCase();
    return p.nombre.toLowerCase().includes(s)||String(p.rut||"").includes(s)||String(p.kw||"").toLowerCase().includes(s);
  }),[provs,searchP]);

  // ── useEffects ────────────────────────────────────────────────────────────
  useEffect(()=>{if(txs.length>0)setAssignments(assignDocs(txs,provs,docsDB));},[provs,docsDB]);
  useEffect(()=>setPage(1),[filter,search,txs]);
  useEffect(()=>saveP(provs),[provs]);

  // ── Sesión + carga inicial desde Supabase ─────────────────────────────────
  useEffect(()=>{
    if(!sb)return;
    sb.auth.getSession().then(({data})=>setSession(data&&data.session));
    const {data:authSub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    (async()=>{
      try{
        const {data:pv,error:pe}=await sb.from("proveedores").select("id,nombre,rut,kw").order("id");
        if(pe)throw pe;
        if(pv&&pv.length)setProvs(pv);
        const {data:dc,error:de}=await sb.from("documentos_manager").select("tipo,ndoc,rut,razon,fecha,total,codigo,descripcion,centro_costo,conciliado");
        if(de)throw de;
        if(dc)setDocsDB(dc.map(d=>({...d,centroCosto:d.centro_costo||"",conciliado:!!d.conciliado})));
        setDbMsg("☁ Conectado a la nube.");
      }catch(err){setDbMsg("⚠ Sin conexión a la nube — usando datos locales. ("+(err.message||err)+")");}
    })();
    return ()=>{try{authSub&&authSub.subscription&&authSub.subscription.unsubscribe();}catch{}};
  },[]);

  // ── Login / Logout ────────────────────────────────────────────────────────
  const doLogin=async()=>{
    if(!sb)return;setAuthErr("");setAuthBusy(true);
    const {error}=await sb.auth.signInWithPassword({email:authEmail.trim(),password:authPass});
    setAuthBusy(false);
    if(error)setAuthErr("❌ "+error.message);
    else{setShowLogin(false);setAuthPass("");setAuthErr("");}
  };
  const doLogout=async()=>{if(sb)await sb.auth.signOut();};

  // ── readSheet helper ──────────────────────────────────────────────────────
  const readSheet=file=>new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}));
    }catch(err){rej(err);}};
    rd.onerror=rej;rd.readAsArrayBuffer(file);
  });

  // ── cargar estado de cuenta ───────────────────────────────────────────────
  const loadEC=useCallback(async file=>{
    if(!file)return;setLoading(true);setEcMsg("");
    try{
      const data=await readSheet(file);
      const rows=parseEC(data);
      if(!rows.length){setEcMsg("❌ No se detectaron movimientos. Revisa que el archivo tenga encabezados (Fecha, Tipo, Tercero, Débito).");setLoading(false);return;}
      setTxs(rows);setEdits({});
      setAssignments(assignDocs(rows,provs,docsDB));
      setProcessed(true);
      setEcMsg(`✅ ${rows.length} movimientos cargados.`);
    }catch(err){setEcMsg("❌ Error al leer: "+err.message);}
    setLoading(false);
  },[provs,docsDB]);

  // ── cargar docs Manager ───────────────────────────────────────────────────
  const loadDocs=useCallback(async file=>{
    if(!file)return;setDocsMsg("");
    try{
      const data=await readSheet(file);
      const rows=parseDocs(data);
      if(!rows.length){setDocsMsg("❌ No se detectaron documentos válidos.");return;}
      const clean=rows.map(r=>({tipo:r.tipo,ndoc:r.ndoc,rut:r.rut,razon:r.razon,fecha:r.fecha,total:r.total,codigo:r.codigo,descripcion:r.descripcion,centroCosto:r.centroCosto||"",conciliado:false}));
      if(sb&&session){
        setDocsMsg("⏳ Guardando en la nube…");
        const del=await sb.from("documentos_manager").delete().gt("id",0);
        if(del.error)throw del.error;
        // insertar por lotes (mapeando centroCosto → columna centro_costo)
        const dbRows=clean.map(r=>({tipo:r.tipo,ndoc:r.ndoc,rut:r.rut,razon:r.razon,fecha:r.fecha,total:r.total,codigo:r.codigo,descripcion:r.descripcion,centro_costo:r.centroCosto}));
        for(let i=0;i<dbRows.length;i+=500){
          const ins=await sb.from("documentos_manager").insert(dbRows.slice(i,i+500));
          if(ins.error)throw ins.error;
        }
        setDocsDB(clean);setDocsName(file.name);
        setDocsMsg(`✅ ${clean.length} documentos guardados en la nube desde "${file.name}".`);
      }else{
        setDocsDB(clean);setDocsName(file.name);
        setDocsMsg(`✅ ${clean.length} documentos cargados (solo en esta sesión — inicia sesión para guardarlos en la nube).`);
      }
    }catch(err){setDocsMsg("❌ Error: "+(err.message||err));}
  },[session]);

  // ── marcar documentos como conciliados (para no reutilizarlos en la otra tarjeta) ──
  const dkey=d=>(d.tipo||"")+"|"+(d.ndoc||"")+"|"+(d.rut||"");
  const markConciliados=async()=>{
    const keys=new Set();const docs=[];
    assignments.forEach((a,i)=>{if(!a||a._reversado||a._costoTC)return;const list=(a._multi&&a._docs)?a._docs:[a];
      list.forEach((d,li)=>{const lk=li===0?String(i):i+"_"+(li-1);
        const eN=editVal(edits,lk,"ndoc",d.ndoc||"");
        const ed={...d,ndoc:eN};const k=dkey(ed);
        if(eN&&!keys.has(k)){keys.add(k);docs.push(ed);}});});
    if(!docs.length){setEcMsg("No hay documentos asociados para marcar.");return;}
    if(!confirm(`¿Marcar ${docs.length} documento(s) como conciliados? No se volverán a usar en la otra tarjeta. (Se reinician al recargar el listado Manager.)`))return;
    try{
      if(sb&&session){for(const d of docs){const r=await sb.from("documentos_manager").update({conciliado:true}).eq("tipo",d.tipo).eq("ndoc",d.ndoc).eq("rut",d.rut);if(r.error)throw r.error;}}
      setDocsDB(prev=>prev.map(d=>keys.has(dkey(d))?{...d,conciliado:true}:d));
      setTxs([]);setAssignments([]);setProcessed(false);
      setEcMsg(`✅ ${docs.length} documento(s) marcados como conciliados. Ahora carga el estado de cuenta de la otra tarjeta.`);
    }catch(err){setEcMsg("❌ "+(err.message||err));}
  };
  const resetConciliados=async()=>{
    if(!confirm("¿Reiniciar el estado 'conciliado' de TODOS los documentos? (Quedarán disponibles para conciliar de nuevo.)"))return;
    try{
      if(sb&&session){const r=await sb.from("documentos_manager").update({conciliado:false}).gt("id",0);if(r.error)throw r.error;}
      setDocsDB(prev=>prev.map(d=>({...d,conciliado:false})));
      setDocsMsg("✅ Documentos 'conciliado' reiniciados — todos disponibles.");
    }catch(err){setDocsMsg("❌ "+(err.message||err));}
  };

  // ── importar proveedores ──────────────────────────────────────────────────
  const importProvs=useCallback(async file=>{
    if(!file)return;setProvMsg("");
    try{
      const data=await readSheet(file);
      const rows=parseProvsXlsx(data);
      if(!rows.length){setProvMsg("❌ No se detectaron proveedores.");return;}
      const out=provs.slice();
      const byRut=new Map();out.forEach((p,i)=>{if(p.rut)byRut.set(normRut(p.rut),i);});
      let maxId=out.reduce((m,p)=>Math.max(m,p.id||0),0);
      const touched=[];let added=0,upd=0;
      for(const r of rows){
        const kw=r.kw||autoKw(r.nombre);
        const key=normRut(r.rut);
        if(r.rut&&byRut.has(key)){const idx=byRut.get(key);out[idx]={...out[idx],nombre:r.nombre,kw};touched.push(out[idx]);upd++;}
        else{const np={id:++maxId,nombre:r.nombre,rut:r.rut,kw};out.push(np);if(r.rut)byRut.set(key,out.length-1);touched.push(np);added++;}
      }
      if(sb&&session){
        // consolidar por id (si el archivo trae RUT repetidos, evita el error "affect row a second time")
        const byId=new Map();
        for(const p of touched)byId.set(p.id,{id:p.id,nombre:p.nombre,rut:p.rut,kw:p.kw});
        const payload=[...byId.values()];
        for(let i=0;i<payload.length;i+=500){
          const up=await sb.from("proveedores").upsert(payload.slice(i,i+500),{onConflict:"id"});
          if(up.error)throw up.error;
        }
      }
      setProvs(out);

      :sb&&e("div",{style:{marginBottom:12,padding:"12px 14px",background:C.surf,border:"1px dashed "+C.border,borderRadius:10,fontSize:13,color:C.muted}},"🔒 Inicia sesión para cargar/reemplazar el listado Manager. (Solo lectura)"),
    docsMsg&&e("div",{style:{marginBottom:12,fontSize:13,color:docsMsg[0]==="✅"?C.green:C.red}},docsMsg),
    e("div",{style:{border:"1px solid "+C.border,borderRadius:10,overflow:"auto",background:C.surf,maxHeight:600}},
      e("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12.5}},
        e("thead",null,e("tr",null,["Tipo","N° Doc","RUT","Razón Social","Fecha","Total (CLP)","Cod. Servicio","Centro Costo","Descripción"].map((hh,j)=>
          e("th",{key:j,style:{background:C.surf2,color:C.teal,padding:"9px 9px",textAlign:j===5?"right":"left",borderBottom:"1px solid "+C.border,position:"sticky",top:0,fontSize:11,fontWeight:700}},hh)))),
        e("tbody",null,docsDB.slice(0,1000).map((d,j)=>e("tr",{key:j,className:"rn"},
          e("td",{style:tdP(C.muted)},d.tipo),
          e("td",{style:tdP()},d.ndoc),
          e("td",{style:tdP(C.muted)},d.rut),
          e("td",{style:tdP(C.acL)},d.razon),
          e("td",{style:tdP(C.muted)},fmtDate(d.fecha)),
          e("td",{style:{...tdP(C.teal),textAlign:"right"}},fmtCLP(d.total)),
          e("td",{style:tdP(C.muted)},d.codigo),
          e("td",{style:tdP(C.acL)},d.centroCosto),
          e("td",{style:tdP(C.muted)},d.descripcion))))),
      docsDB.length>1000&&e("div",{style:{padding:10,fontSize:12,color:C.muted,textAlign:"center"}},"Mostrando primeros 1000")));

  // ════════ MODAL LOGIN ════════
  const loginModal=showLogin&&e("div",{onClick:()=>setShowLogin(false),
    style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}},
    e("div",{onClick:ev=>ev.stopPropagation(),style:{background:C.surf,border:"1px solid "+C.border,borderRadius:12,padding:24,width:360,maxWidth:"92vw"}},
      e("div",{style:{fontWeight:800,fontSize:17,marginBottom:4}},"🔐 Iniciar sesión"),
      e("div",{style:{fontSize:12,color:C.muted,marginBottom:16}},"Solo usuarios autorizados pueden editar la base."),
      e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
        fld("Correo",authEmail,setAuthEmail,"1 1 auto"),
        e("div",{style:{display:"flex",flexDirection:"column",gap:5}},
          e("label",{style:{fontSize:11,color:C.muted}},"Contraseña"),
          e("input",{type:"password",value:authPass,onChange:ev=>setAuthPass(ev.target.value),
            onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},
            style:{background:C.bg,border:"1px solid "+C.border,borderRadius:7,padding:"8px 10px",color:C.text,fontSize:13}}))),
      authErr&&e("div",{style:{fontSize:12,color:C.red,marginTop:10}},authErr),
      e("div",{style:{display:"flex",gap:8,marginTop:16}},
        e("button",{className:"btnh",onClick:doLogin,disabled:authBusy,
          style:{background:C.accent,color:C.white,border:"none",borderRadius:8,padding:"9px 18px",fontWeight:700,flex:1}},authBusy?"⏳…":"Entrar"),
        e("button",{onClick:()=>setShowLogin(false),style:btnSec},"Cancelar"))));

  // Marca de agua: logo grande, fijo en la parte inferior, DETRÁS del contenido
  // (z-index 0 + pointer-events none). Las tablas tienen fondo opaco, así que no
  // interfieren con la info: el logo solo se ve en las zonas oscuras vacías.
  const watermark=e("div",{style:{position:"fixed",left:0,right:0,bottom:0,height:"55vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",paddingBottom:48,pointerEvents:"none",zIndex:0,overflow:"hidden"}},
    e("div",{style:{opacity:0.05,display:"flex",flexDirection:"column",alignItems:"center",gap:10}},
      e("div",{style:{fontWeight:800,fontSize:90,letterSpacing:3,color:C.white,lineHeight:1}},"Global66")));

  // Pestañas en la zona oscura (EECC / Proveedores / Documentos)
  const tabsRow=e("div",{style:{display:"flex",justifyContent:"center",gap:8,marginBottom:18,flexWrap:"wrap"}},
    [["cruce","EECC"],["proveedores","Proveedores"],["docs","Documentos"]].map(([k,l])=>
      e("div",{key:k,onClick:()=>setTab(k),style:{
        padding:"9px 22px",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:14,transition:"all .15s",
        color:tab===k?C.white:C.muted,background:tab===k?C.accent:C.surf,
        border:"1px solid "+(tab===k?C.accent:C.border)}},l)));

  // ════════ PANTALLA DE LOGIN ════════
  // Si hay nube y NO hay sesión, mostrar SOLO el login con el logo de marca de agua detrás.
  if(sb&&!session){
    return e("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",background:C.bg,padding:20}},
      e("div",{style:{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",zIndex:0}},
        e("div",{style:{opacity:0.06,display:"flex",flexDirection:"column",alignItems:"center",gap:14}},
          e("div",{style:{fontWeight:800,fontSize:96,letterSpacing:3,color:C.white,lineHeight:1}},"Global66"))),
      e("div",{style:{position:"relative",zIndex:1,background:C.surf,border:"1px solid "+C.border,borderRadius:16,padding:"34px 30px",width:390,maxWidth:"92vw",boxShadow:"0 16px 50px rgba(0,0,0,.55)"}},
        e("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:10,marginBottom:20}},
          e("div",{style:{fontWeight:800,fontSize:24,color:C.text}},"Global66 · Conciliador TC"),
          e("div",{style:{fontSize:12,color:C.muted,textAlign:"center"}},"Conciliación Mensual de Tarjetas + Manager")),
        e("div",{style:{fontWeight:700,fontSize:15,marginBottom:3,color:C.text}},"Iniciar sesión"),
        e("div",{style:{fontSize:12,color:C.muted,marginBottom:16}},"Ingresa con tu cuenta autorizada."),
        e("div",{style:{display:"flex",flexDirection:"column",gap:11}},
          fld("Correo",authEmail,setAuthEmail,"1 1 auto"),
          e("div",{style:{display:"flex",flexDirection:"column",gap:5}},
            e("label",{style:{fontSize:11,color:C.muted}},"Contraseña"),
            e("input",{type:"password",value:authPass,onChange:ev=>setAuthPass(ev.target.value),
              onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},
              style:{background:C.bg,border:"1px solid "+C.border,borderRadius:8,padding:"11px 12px",color:C.text,fontSize:14}}))),
        authErr&&e("div",{style:{fontSize:12.5,color:C.red,marginTop:12}},authErr),
        e("button",{className:"btnh",onClick:doLogin,disabled:authBusy,
          style:{marginTop:20,width:"100%",background:C.accent,color:C.white,border:"none",borderRadius:10,padding:"12px",fontWeight:700,fontSize:15}},authBusy?"⏳ Entrando…":"Entrar")));
  }

  return e("div",null,watermark,header,loginModal,
    e("div",{style:{position:"relative",zIndex:1,maxWidth:1400,margin:"0 auto",padding:20}},
      tabsRow,
      dbMsg&&e("div",{style:{fontSize:11.5,color:C.muted,marginBottom:12,padding:"6px 10px",background:C.surf,border:"1px solid "+C.border,borderRadius:7,display:"inline-block"}},dbMsg),
      tab==="cruce"?tabCruce:tab==="proveedores"?tabProv:tabDocs));
}

// estilos compartidos (helpers definidos tras App para closure simple)
function btnPg(dis){return{background:C.surf,color:dis?C.border:C.text,border:"1px solid "+C.border,borderRadius:6,padding:"6px 11px",fontSize:13,cursor:dis?"default":"pointer"};}
const btnSec={background:C.surf2,color:C.text,border:"1px solid "+C.border,borderRadius:8,padding:"9px 14px",fontWeight:600,fontSize:13};
const iconBtn={background:"transparent",border:"none",fontSize:15,marginRight:6,padding:2};
function tdP(col){return{padding:"7px 10px",borderBottom:"1px solid "+C.border,color:col||C.text,maxWidth:300,overflow:"hidden",textOverflow:"ellipsis"};}
function fld(label,val,onCh,flex){return e("div",{style:{flex:flex||"1 1 200px",display:"flex",flexDirection:"column",gap:5}},
  e("label",{style:{fontSize:11,color:C.muted}},label),
  e("input",{value:val,onChange:ev=>onCh(ev.target.value),style:{background:C.bg,border:"1px solid "+C.border,borderRadius:7,padding:"8px 10px",color:C.text,fontSize:13}}));}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));

</script>
</body>
</html>
